<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0f19">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>MindPulse: Desafío Numérico</title>
<style>
:root{--bg-color:#0b0f19;--card-bg:#161f32;--neon-cyan:#00f2fe;--neon-pink:#ff007f;--neon-green:#39ff14;--text-color:#fff}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
html,body{height:100%;height:100dvh}
body{background:var(--bg-color);color:var(--text-color);display:flex;flex-direction:column;align-items:center;padding:15px;padding-top:max(15px,env(safe-area-inset-top,0px));padding-bottom:max(15px,env(safe-area-inset-bottom,0px));overflow:hidden;transition:background .4s}
.screen{position:fixed;inset:0;background:var(--bg-color);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;padding:20px;text-align:center;overflow-y:auto}
.hidden{display:none!important}
h1{font-size:2.5rem;color:var(--neon-cyan);text-shadow:0 0 10px var(--neon-cyan);margin-bottom:5px}
.subtitle{color:#8a99ad;margin-bottom:40px;font-size:1rem}
.btn{background:var(--card-bg);color:var(--text-color);border:2px solid var(--neon-cyan);padding:15px 40px;font-size:1.2rem;border-radius:30px;margin:10px 0;width:80%;max-width:300px;cursor:pointer;box-shadow:0 0 15px rgba(0,242,254,.2);transition:transform .1s;touch-action:manipulation}
.btn:active{transform:scale(.95)}
.btn-easy{border-color:var(--neon-green);box-shadow:0 0 15px rgba(57,255,20,.2)}
.btn-hard{border-color:var(--neon-pink);box-shadow:0 0 15px rgba(255,0,127,.2)}
.game-container{width:100%;max-width:450px;height:100%;display:flex;flex-direction:column;justify-content:space-between}
.header-bar{display:flex;justify-content:space-between;align-items:center;background:var(--card-bg);padding:12px;border-radius:15px;font-weight:bold;font-size:.9rem}
.oxigen-bar-container{width:80px;height:10px;background:#25334f;border-radius:5px;overflow:hidden;margin-top:4px}
.oxigen-bar{width:100%;height:100%;background:var(--neon-cyan);box-shadow:0 0 8px var(--neon-cyan);transition:width .1s linear}
.oxigen-bar.low{background:var(--neon-pink);box-shadow:0 0 8px var(--neon-pink)}
.hearts{font-size:1.2rem}
.heart{height:22px;width:auto;vertical-align:middle;margin-left:3px}
.heart.lost{opacity:.25;filter:grayscale(1)}
.display-box{background:var(--card-bg);border-radius:20px;flex:1;min-height:110px;max-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:12px 0;border:1px solid #25334f;text-align:center;padding:0 10px}
.phase-indicator{color:#8a99ad;font-size:.85rem;text-transform:uppercase;letter-spacing:2px;margin-bottom:10px;font-weight:bold}
.main-number{font-size:3.5rem;font-weight:bold;color:var(--neon-cyan);text-shadow:0 0 20px var(--neon-cyan);min-height:4.2rem;transition:transform .08s}
.input-preview{font-size:2.2rem;font-weight:bold;color:#fff;letter-spacing:5px;min-height:50px;max-width:100%;overflow:hidden;white-space:nowrap}
.streak-container{display:flex;justify-content:center;gap:15px;margin-bottom:12px}
.streak-dot{width:25px;height:12px;background:#25334f;border-radius:6px}
.streak-dot.active{background:var(--neon-green);box-shadow:0 0 8px var(--neon-green)}
.keyboard{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:5px}
.key{background:var(--card-bg);border:1px solid #25334f;color:#fff;font-size:1.6rem;font-weight:bold;padding:clamp(10px,2.4vh,18px) 0;border-radius:15px;text-align:center;cursor:pointer;touch-action:manipulation}
.key:active{background:#25334f;border-color:var(--neon-cyan)}
.key-action{background:#1b263b;font-size:1.1rem;display:flex;align-items:center;justify-content:center}
.flash-correct{animation:flashG .4s ease-out}
.flash-wrong{animation:flashR .4s ease-out}
@keyframes flashG{50%{background:rgba(57,255,20,.3);border-color:var(--neon-green)}}
@keyframes flashR{50%{background:rgba(255,0,127,.3);border-color:var(--neon-pink)}}
</style>
</head>
<body>
<div id="menu-screen" class="screen">
  <img id="logo" alt="" style="width:120px;height:auto;margin-bottom:10px;filter:drop-shadow(0 0 18px rgba(255,0,127,.45))">
  <h1>MINDPULSE</h1>
  <div class="subtitle">Desafío de Oxigenación Cerebral</div>
  <p style="color:#8a99ad;margin-bottom:20px;font-size:.9rem">Selecciona una dificultad:</p>
  <button class="btn btn-easy" onclick="startGame('facil')">🟢 FÁCIL</button>
  <button class="btn" onclick="startGame('medio')">🟡 MEDIO</button>
  <button class="btn btn-hard" onclick="startGame('dificil')">🔴 DIFÍCIL</button>
  <div id="online" class="hidden" style="background:var(--card-bg);border-radius:15px;padding:12px;width:80%;max-width:300px;margin-top:15px;font-size:.85rem;text-align:left">
    <div id="live" style="color:var(--neon-green);margin-bottom:8px"></div>
    <div style="color:#8a99ad;margin-bottom:4px">🏆 RANKING</div>
    <div id="board" style="line-height:1.6"></div>
  </div>
</div>

<div id="end-screen" class="screen hidden">
  <h1 id="end-title">FIN DEL JUEGO</h1>
  <div id="end-subtitle" class="subtitle">Tu cerebro se quedó sin vidas</div>
  <div style="background:var(--card-bg);padding:20px;border-radius:15px;width:80%;max-width:300px;margin-bottom:30px">
    <p style="color:#8a99ad">Nivel Máximo</p>
    <p id="end-level" style="font-size:2rem;font-weight:bold;color:var(--neon-cyan)">1</p>
    <p id="end-stats" style="color:#8a99ad;font-size:.9rem;margin-top:10px;line-height:1.5"></p>
  </div>
  <button class="btn" onclick="showMenu()">VOLVER A JUGAR</button>
</div>

<div id="game-layout" class="game-container hidden">
  <div class="header-bar">
    <div><div>⚡ OXÍGENO</div><div class="oxigen-bar-container"><div id="oxigen-bar" class="oxigen-bar"></div></div></div>
    <div style="text-align:center"><span style="color:#8a99ad;font-size:.75rem">MODO</span><div id="mode-tag" style="color:var(--neon-cyan)">FÁCIL</div></div>
    <div style="text-align:right"><div id="level-tag">NIVEL 1</div><div id="hearts" class="hearts"></div></div>
  </div>
  <div id="display-box" class="display-box">
    <div id="phase-indicator" class="phase-indicator">Memoriza</div>
    <div id="main-number" class="main-number"></div>
    <div id="input-preview" class="input-preview hidden"></div>
  </div>
  <div class="streak-container">
    <div id="dot-0" class="streak-dot"></div><div id="dot-1" class="streak-dot"></div><div id="dot-2" class="streak-dot"></div>
  </div>
  <div class="keyboard">
    <div class="key" onclick="pressKey(1)">1</div><div class="key" onclick="pressKey(2)">2</div><div class="key" onclick="pressKey(3)">3</div>
    <div class="key" onclick="pressKey(4)">4</div><div class="key" onclick="pressKey(5)">5</div><div class="key" onclick="pressKey(6)">6</div>
    <div class="key" onclick="pressKey(7)">7</div><div class="key" onclick="pressKey(8)">8</div><div class="key" onclick="pressKey(9)">9</div>
    <div class="key key-action" onclick="pressKey('C')">BORRAR</div>
    <div class="key" onclick="pressKey(0)">0</div>
    <div class="key key-action" style="color:var(--neon-green)" onclick="pressKey('OK')">LISTO</div>
  </div>
</div>

// --- Audio sintetizado (Web Audio API, funciona sin internet) ---
let actx=null;
function beep(f,d,type){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended')actx.resume();
    const o=actx.createOscillator(),g=actx.createGain();
    o.type=type||'sine';o.frequency.value=f;
    g.gain.setValueAtTime(.15,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);
    o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d);
  }catch(e){}
}

// drain = oxígeno que se pierde por segundo mientras escribes
// allow = ms por dígito para ganar el bono de rapidez
const MODES={
  facil:{name:'FÁCIL',digits:3,ms:1500,drain:1.5,allow:1500,msg:'¡Digita en orden!',fn:s=>s.slice()},
  medio:{name:'MEDIO',digits:4,ms:1000,drain:1.8,allow:2000,msg:'¡Digita al revés!',fn:s=>s.slice().reverse()},
  dificil:{name:'DIFÍCIL',digits:5,ms:800,drain:2.0,allow:2500,msg:'¡Ordena de menor a mayor!',fn:s=>s.slice().sort((a,b)=>a-b)}
};
const BGS=['#0b0f19','#150b19','#0b1914','#19130b'];
const GAP=180;           // pausa entre dígitos (permite ver dígitos repetidos)
const MAX_LEVEL=10;
let G=null,timers=[];

function later(fn,ms){const t=setTimeout(fn,ms);timers.push(t);return t}
function clearAll(){timers.forEach(clearTimeout);timers=[];if(G&&G.oxTimer){clearInterval(G.oxTimer);G.oxTimer=null}}

function seqLen(l){return MODES[G.mode].digits+(l<=3?0:l<=6?1:l<=9?2:3)}
function showMs(l){return MODES[G.mode].ms*(l<=3?1:l<=6?.9:l<=9?.8:.7)}

function buildHearts(){
  const h=$('hearts');h.innerHTML='';
  for(let i=0;i<3;i++){const im=document.createElement('img');im.src=BRAIN;im.alt='';im.className='heart';h.appendChild(im)}
}
function startGame(mode){
  clearAll();
  G={mode,level:1,streak:0,lives:3,ox:100,seq:[],typed:[],phase:'idle',times:[],maxLen:0,oxTimer:null,t0:0,last:0};
  $('menu-screen').classList.add('hidden');
  $('end-screen').classList.add('hidden');
  $('game-layout').classList.remove('hidden');
  $('mode-tag').textContent=MODES[mode].name;
  buildHearts();
  beep(520,.12);
  updateHUD();
  later(nextRound,500);
}
function showMenu(){
  clearAll();G=null;if(window.pushPresence)pushPresence();
  document.body.style.background='';
  $('end-screen').classList.add('hidden');
  $('game-layout').classList.add('hidden');
  $('menu-screen').classList.remove('hidden');
}
// Barra de oxígeno: ligera, se llama cada 100 ms
function updateOxygen(){
  G.ox=Math.max(0,Math.min(100,G.ox));
  const b=$('oxigen-bar');
  b.style.width=G.ox+'%';
  b.classList.toggle('low',G.ox<25);
}
// HUD completo: solo cuando cambia nivel, vidas o racha
function updateHUD(){
  if(window.pushPresence)pushPresence();
  $('level-tag').textContent='NIVEL '+G.level;
  const hs=$('hearts').children;
  for(let i=0;i<hs.length;i++)hs[i].classList.toggle('lost',i>=G.lives);
  for(let i=0;i<3;i++)$('dot-'+i).classList.toggle('active',i<G.streak);
  updateOxygen();
}
function nextRound(){
  if(!G||G.lives<=0)return;
  const len=seqLen(G.level);
  G.seq=Array.from({length:len},()=>Math.floor(Math.random()*10));
  G.typed=[];G.phase='show';
  G.maxLen=Math.max(G.maxLen,len);
  document.body.style.background=G.level>=7?BGS[1+Math.floor(Math.random()*3)]:'';
  $('input-preview').classList.add('hidden');
  $('main-number').classList.remove('hidden');
  $('main-number').textContent='';
  $('main-number').style.transform='';
  $('phase-indicator').textContent='Memoriza';
  const ms=showMs(G.level);
  G.seq.forEach((d,i)=>{
    later(()=>{
      $('main-number').textContent=d;
      if(G.level>=7)$('main-number').style.transform='translate('+(Math.random()*30-15)+'px,'+(Math.random()*16-8)+'px)';
      beep(440+d*40,.08);
    },700+i*(ms+GAP));
    later(()=>{$('main-number').textContent=''},700+i*(ms+GAP)+ms);
  });
  later(startInput,700+len*(ms+GAP));
}
function startInput(){
  if(!G)return;
  if(G.oxTimer){clearInterval(G.oxTimer);G.oxTimer=null}
  G.phase='input';G.t0=Date.now();G.last=G.t0;
  $('main-number').classList.add('hidden');
  $('main-number').style.transform='';
  $('phase-indicator').textContent=MODES[G.mode].msg;
  $('input-preview').classList.remove('hidden');
  renderInput();
  const drain=MODES[G.mode].drain;
  G.oxTimer=setInterval(()=>{
    if(!G||G.phase!=='input')return;
    const now=Date.now(),dt=now-G.last;G.last=now;
    if(document.hidden)return;                 // pestaña en segundo plano: no penalizar
    G.ox-=drain*Math.min(dt,250)/1000;         // basado en tiempo real, no en ticks
    updateOxygen();
    if(G.ox<=0)fail('¡Sin oxígeno!');
  },100);
}
function renderInput(){
  $('input-preview').textContent=G.typed.join('')+'_'.repeat(G.seq.length-G.typed.length);
}
function pressKey(k){
  if(!G||G.phase!=='input')return;
  if(k==='C'){G.typed.pop();beep(300,.06)}
  else if(k==='OK'){if(G.typed.length===G.seq.length)submit();else beep(180,.15,'square');return}
  else if(typeof k==='number'&&G.typed.length<G.seq.length){G.typed.push(k);beep(600+k*30,.06)}
  renderInput();
}
function submit(){
  if(!G||G.phase!=='input')return;
  clearInterval(G.oxTimer);G.oxTimer=null;
  const exp=MODES[G.mode].fn(G.seq);
  const ok=exp.join('')===G.typed.join('');
  const dt=Date.now()-G.t0;
  if(ok){
    G.phase='wait';
    G.times.push(dt/G.seq.length);
    flash('flash-correct');
    beep(880,.12);later(()=>beep(1175,.15),120);
    G.ox+=dt<G.seq.length*MODES[G.mode].allow?15:6;
    G.streak++;
    let msg='¡Correcto!';
    if(G.streak>=3){
      if(G.level>=MAX_LEVEL){updateHUD();later(()=>endGame(true),800);return}
      G.level++;G.streak=0;G.ox+=20;msg='¡Nivel superado!';
      beep(1320,.25);
    }
    $('phase-indicator').textContent=msg;
    updateHUD();later(nextRound,1000);
  }else fail('Era: '+exp.join(' '));
}
function fail(msg){
  if(!G||G.phase==='wait'||G.phase==='idle')return;
  clearInterval(G.oxTimer);G.oxTimer=null;G.phase='wait';
  flash('flash-wrong');
  beep(140,.35,'sawtooth');
  if(navigator.vibrate)navigator.vibrate(200);
  G.lives--;G.streak=0;
  if(G.ox<=0)G.ox=40;
  $('phase-indicator').textContent=msg;
  updateHUD();
  if(G.lives<=0)later(()=>endGame(false),1400);
  else later(nextRound,1600);
}
function flash(c){
  const b=$('display-box');b.classList.remove('flash-correct','flash-wrong');
  void b.offsetWidth;b.classList.add(c);
}
function endGame(win){
  clearAll();G.phase='idle';
  if(window.saveScore)saveScore(win);
  document.body.style.background='';
  $('game-layout').classList.add('hidden');
  $('end-screen').classList.remove('hidden');
  $('end-title').textContent=win?'¡VICTORIA!':'FIN DEL JUEGO';
  $('end-subtitle').textContent=win?'Completaste los 10 niveles. ¡Cerebro oxigenado!':'Tu cerebro se quedó sin vidas';
  $('end-level').textContent=G.level;
  const avg=G.times.length?(G.times.reduce((a,b)=>a+b,0)/G.times.length/1000).toFixed(2):'—';
  $('end-stats').innerHTML='Máx. dígitos recordados: '+G.maxLen+'<br>Reacción promedio: '+avg+' s por dígito';
}

// --- Teclado físico (PC) ---
document.addEventListener('keydown',e=>{
  if(e.key.length===1&&e.key>='0'&&e.key<='9')pressKey(+e.key);
  else if(e.key==='Backspace')pressKey('C');
  else if(e.key==='Enter')pressKey('OK');
});

// --- Modo en línea: solo existe dentro del entorno de Claude; en GitHub Pages se omite sin errores ---
(async()=>{
  if(typeof claude==='undefined'||!claude||typeof claude.use!=='function')return;
  let db=null,room=null,user=null,uid=null;
  try{[db,room,user]=await Promise.all([claude.use('db'),claude.use('room'),claude.use('user')])}catch(e){return}
  if(!db&&!room)return;
  $('online').classList.remove('hidden');
  try{if(user)uid=await user.id()}catch(e){}
  const name=async id=>{try{const p=await user.profiles([id]);return p[id]&&p[id].name||'Jugador'}catch(e){return 'Jugador'}};
  const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  if(room){
    window.pushPresence=()=>{room.presence(G?{playing:true,lvl:G.level,mode:MODES[G.mode].name}:{playing:false,lvl:null,mode:null}).catch(()=>{})};
    pushPresence();
    room.onPeers(ch=>{
      const ps=ch.peers.filter(p=>p.kind==='viewer');
      const rows=ps.map(p=>esc(p.isMe?'Tú':(p.by||'Jugador'))+(p.presence.playing?' · '+esc(p.presence.mode)+' N'+esc(p.presence.lvl):' · menú'));
      $('live').innerHTML='🟢 '+ps.length+' en línea'+(rows.length?'<div style="color:#8a99ad;font-size:.78rem">'+rows.slice(0,4).join('<br>')+'</div>':'');
    });
  }
  if(db){
    const col=db.collection('scores');
    col.orderBy('score','desc').limit(5).onSnapshot(async s=>{
      const rows=await Promise.all(s.docs.map(async(d,i)=>{const v=d.data();return (i+1)+'. '+esc(await name(d.id))+' — N'+esc(v.level)+' · '+esc(v.score)+' pts'}));
      $('board').innerHTML=rows.length?rows.join('<br>'):'<span style="color:#8a99ad">Sé el primero en el ranking</span>';
    },()=>{});
    window.saveScore=async win=>{
      if(!uid||!G)return;
      const score=G.level*100+G.maxLen*10+(win?500:0);
      try{
        const ref=col.doc(uid),cur=await ref.get();
        if(cur.exists&&cur.data().score>=score)return;
        await ref.set({level:G.level,maxLen:G.maxLen,mode:G.mode,score});
      }catch(e){}
    };
  }
})();

// --- PWA: funciona sin internet una vez cargado (solo en http/https) ---
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
